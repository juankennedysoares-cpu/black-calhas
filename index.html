<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Calhas — Orçamentos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --bg:#0E0F11; --surface:#17191C; --surface-2:#1F2226;
    --border:#33383D; --border-soft:#262A2E;
    --amber:#E8B44A; --amber-dim:#7A5F26;
    --text:#F2F1ED; --text-2:#9CA0A6; --text-3:#686E74;
    --danger:#D9705F; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;}
  .app{max-width:480px; margin:0 auto; padding:0 0 48px;}

  header.top{
    padding:20px 20px 18px;
    background: repeating-linear-gradient(135deg, rgba(232,180,74,.05) 0 2px, transparent 2px 14px), var(--surface);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:14px;
  }
  header.top img{width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--border);}
  .brand{font-family:'Archivo',sans-serif; font-weight:800; font-size:22px; letter-spacing:.5px; text-transform:uppercase; margin:0; line-height:1;}
  .tagline{color:var(--text-2); font-size:12px; margin:5px 0 0;}

  nav.tabs{display:flex; margin:16px 20px 0; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:3px; gap:3px;}
  nav.tabs button{flex:1; background:transparent; border:none; color:var(--text-2); font-family:'Inter'; font-size:13px; font-weight:600; padding:9px 4px; border-radius:7px; cursor:pointer;}
  nav.tabs button.active{background:var(--bg); color:var(--amber);}

  main{padding:18px 20px 0;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px;}
  .section-title{font-family:'Archivo'; font-size:12px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-2); margin:0 0 12px; font-weight:700;}
  label{display:block; font-size:12px; color:var(--text-2); margin:12px 0 5px;}
  .card > label:first-of-type{margin-top:0;}
  input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    font-family:'Inter'; font-size:14px; padding:10px 11px; border-radius:8px; outline:none;
  }
  textarea{min-height:88px; resize:vertical; line-height:1.5;}
  input:focus,select:focus,textarea:focus{border-color:var(--amber);}
  select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0L5 6L10 0' fill='none' stroke='%239CA0A6' stroke-width='1.4'/></svg>");background-repeat:no-repeat;background-position:right 12px center;}
  .hint{font-size:11px; color:var(--text-3); margin-top:5px; line-height:1.45;}
  .row2{display:flex; gap:10px;} .row2>div{flex:1;}

  button.btn{font-family:'Inter'; font-weight:600; font-size:14px; border-radius:8px; padding:10px 14px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); cursor:pointer;}
  button.btn:active{transform:scale(.98);}
  button.btn-primary{background:var(--amber); color:#241A05; border-color:var(--amber); width:100%; margin-top:14px; font-size:15px; padding:12px 14px;}
  button.btn-ghost{background:transparent; border:1px dashed var(--border); color:var(--text-2); width:100%;}
  button.icon-btn{background:transparent; border:none; color:var(--text-3); font-size:17px; cursor:pointer; padding:4px 6px; line-height:1;}
  button.icon-btn.danger{color:var(--danger);}

  .catalog-item{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px dashed var(--border-soft);}
  .catalog-item:last-of-type{border-bottom:none;}
  .ci-name{font-size:14px; font-weight:500;}
  .ci-meta{font-size:12px; color:var(--text-2); margin-top:2px;}
  .ci-price{font-family:'JetBrains Mono'; font-size:14px; color:var(--amber); text-align:right;}

  .ticket{background:var(--surface); border:1px solid var(--border); border-radius:12px; position:relative; margin-bottom:14px;}
  .ticket-edge{position:absolute; left:0; top:0; bottom:0; width:6px; background:repeating-linear-gradient(180deg,var(--amber-dim) 0 6px,transparent 6px 12px); border-radius:12px 0 0 12px; opacity:.6;}
  .ticket-body{padding:14px 16px 14px 20px;}

  .quote-line{display:flex; align-items:flex-start; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--border-soft);}
  .quote-line:last-of-type{border-bottom:none;}
  .ql-left{flex:1; padding-right:10px;}
  .ql-name{font-size:14px; font-weight:500;}
  .ql-meta{font-size:12px; color:var(--text-2); margin-top:2px; font-family:'JetBrains Mono';}
  .ql-sub{font-family:'JetBrains Mono'; font-size:14px; white-space:nowrap;}

  .sum-row{display:flex; justify-content:space-between; align-items:baseline; padding:6px 0; font-size:13px; color:var(--text-2);}
  .sum-row span:last-child{font-family:'JetBrains Mono'; color:var(--text);}
  .total-row{display:flex; justify-content:space-between; align-items:baseline; padding-top:12px; margin-top:6px; border-top:1px solid var(--border);}
  .total-label{font-family:'Archivo'; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--text-2);}
  .total-value{font-family:'JetBrains Mono'; font-size:22px; font-weight:700; color:var(--amber);}

  .svc{display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-bottom:1px dashed var(--border-soft); cursor:pointer; margin:0;}
  .svc:last-of-type{border-bottom:none;}
  .svc input[type=checkbox]{flex:0 0 19px; width:19px; height:19px; margin:2px 0 0; accent-color:var(--amber); cursor:pointer;}
  .svc-t{display:block; font-size:14px; font-weight:600; color:var(--text);}
  .svc-d{display:block; font-size:12px; color:var(--text-2); line-height:1.45; margin-top:3px;}

  .empty{text-align:center; padding:26px 10px; color:var(--text-2); font-size:13px;}

  .saved-item{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:13px 14px; margin-bottom:10px; cursor:pointer;}
  .saved-top{display:flex; justify-content:space-between; align-items:center;}
  .saved-client{font-size:14px; font-weight:600;}
  .saved-total{font-family:'JetBrains Mono'; color:var(--amber); font-size:14px;}
  .saved-date{font-size:12px; color:var(--text-2); margin-top:3px;}

  .err{color:var(--danger); font-size:12px; margin-top:5px;}
  .warn{background:rgba(217,112,95,.1); border:1px solid rgba(217,112,95,.35); color:#F0A99B; font-size:12px; padding:9px 11px; border-radius:8px; line-height:1.5; margin-bottom:12px;}

  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:14px 14px 0 0; padding:18px 20px 26px; width:100%; max-width:480px; max-height:86vh; overflow-y:auto;}
  .modal-title{font-family:'Archivo'; font-weight:700; font-size:16px; text-transform:uppercase; letter-spacing:1px; margin:0 0 14px;}
  .actions-row{display:flex; gap:8px; margin-top:16px;}
  .actions-row button{flex:1;}

  .toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--amber); color:#241A05; font-size:13px; font-weight:600; padding:9px 16px; border-radius:20px; z-index:100;}
</style>
</head>

<script>
function mostrarFalha(msg){
  try{
    let d=document.getElementById('falha');
    if(!d){
      d=document.createElement('div');
      d.id='falha';
      d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:9999;background:#4A1F1A;color:#F0A99B;'+
        'font:13px/1.5 -apple-system,sans-serif;padding:12px 16px;border-bottom:1px solid #D9705F;white-space:pre-wrap;';
      document.body.appendChild(d);
    }
    d.textContent='Erro no app: '+msg;
  }catch(e){}
}
window.onerror=function(m,f,l){ mostrarFalha(m+' (linha '+l+')'); };
window.addEventListener('unhandledrejection',function(e){
  mostrarFalha((e.reason && e.reason.message) ? e.reason.message : String(e.reason));
});

/* armazenamento: usa o do Claude quando existe (rodando como artifact);
   fora do Claude (arquivo aberto direto ou hospedado em qualquer lugar),
   usa localStorage do navegador, que persiste de verdade no aparelho. */
const _mem = {};
const PREFIXO = 'blackcalhas_';
function temLocalStorage(){
  try{ const k='__t'+Date.now(); localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
}
const _temLS = temLocalStorage();
const store = {
  async get(k){
    if(window.storage && window.storage.get) return await window.storage.get(k);
    if(_temLS){
      const v = localStorage.getItem(PREFIXO+k);
      return v!==null ? {key:k, value:v} : null;
    }
    return _mem[k]!==undefined ? {key:k, value:_mem[k]} : null;
  },
  async set(k,v){
    if(window.storage && window.storage.set) return await window.storage.set(k,v);
    if(_temLS){ localStorage.setItem(PREFIXO+k, v); return {key:k, value:v}; }
    _mem[k]=v; return {key:k, value:v};
  }
};

async function loadData(){
  try{ const r=await store.get('catalogo'); catalogo=r?JSON.parse(r.value):DEFAULT_CATALOG.slice(); }
  catch(e){ catalogo=DEFAULT_CATALOG.slice(); }
  try{ const r=await store.get('orcamentos'); orcamentos=r?JSON.parse(r.value):[]; }
  catch(e){ orcamentos=[]; }
  try{ const r=await store.get('padroes'); padroes=r?JSON.parse(r.value):Object.assign({},DEFAULT_PADROES); }
  catch(e){ padroes=Object.assign({},DEFAULT_PADROES); }
  if(!padroes || typeof padroes!=='object') padroes=Object.assign({},DEFAULT_PADROES);
  try{ const r=await store.get('contador'); contador=r?(parseInt(r.value,10)||0):0; }
  catch(e){ contador=0; }
  let maxExistente=0;
  for(let i=0;i<orcamentos.length;i++) if(orcamentos[i].numero>maxExistente) maxExistente=orcamentos[i].numero;
  if(maxExistente>contador) contador=maxExistente;
  aplicarPadroes(atual);
  render();
}
function aplicarPadroes(o){
  ['servicos','pagamento','garantia','prazo','validade','obs'].forEach(k=>{
    if(!o[k]) o[k]=padroes[k]||'';
  });
  if(!o.servicosSel || !o.servicosSel.length) o.servicosSel=(padroes.servicosSel||[]).slice();
}
async function persist(key,val){
  try{ await store.set(key, JSON.stringify(val)); }
  catch(e){ toast('Não consegui salvar. Tente de novo.'); }
}

document.querySelectorAll('nav.tabs button').forEach(b=>{

});
function switchTab(name){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  ['orcamento','catalogo','salvos','padroes'].forEach(t=>{
    document.getElementById('tab-'+t).style.display = (t===name)?'block':'none';
  });
  window.scrollTo(0,0);
}
function render(){ renderOrcamento(); renderCatalogo(); renderSalvos(); renderPadroes(); }

/* ---------------- números de orçamento (contador persistente) ---------------- */
function garantirNumero(o){
  if(!o.numero){
    contador += 1;
    o.numero = contador;
    persist('contador', contador);
  }
  return o.numero;
}
function numeroOrc(o){
  return String(garantirNumero(o)).padStart(4,'0');
}

function renderCatalogo(){
  const rows = catalogo.length ? catalogo.map(i=>
    '<div class="catalog-item"><div><div class="ci-name">'+esc(i.nome)+'</div><div class="ci-meta">por '+esc(i.unidade)+'</div></div>'+

    '<button class="icon-btn" onclick="editCat(\''+i.id+'\')" aria-label="Editar">&#9998;</button>'+
    '<button class="icon-btn danger" onclick="delCat(\''+i.id+'\')" aria-label="Excluir">&times;</button></div></div>'
  ).join('') : '<div class="empty">Nenhum item cadastrado.</div>';

  const nome=document.getElementById('k-nome').value.trim();

  const err=document.getElementById('k-err');

  if(isNaN(preco)||preco<0){ err.textContent='Informe um preço válido.'; err.style.display='block'; return; }
  if(id){ const i=catalogo.findIndex(c=>c.id===id); if(i>-1) catalogo[i]={id,nome,unidade,preco}; }
  else catalogo.push({id:uid(),nome,unidade,preco});
  persist('catalogo',catalogo); closeModal(); renderCatalogo(); renderOrcamento(); toast('Catálogo atualizado');
}

function delCat(id){ catalogo=catalogo.filter(c=>c.id!==id); persist('catalogo',catalogo); renderCatalogo(); renderOrcamento(); }

/* ---------------- orçamento ---------------- */
function svcRow(s, marcado, fn){
  return '<label class="svc"><input type="checkbox"'+(marcado?' checked':'')+' onchange="'+fn+'(\''+s.id+'\')">'+
         '<span><span class="svc-t">'+esc(s.titulo)+'</span>'+
         '<span class="svc-d">'+esc(s.texto)+'</span></span></label>';
}
function toggleLista(arr,id){
  const i=arr.indexOf(id);
  if(i>-1) arr.splice(i,1); else arr.push(id);
}
function toggleServico(id){
  if(!atual.servicosSel) atual.servicosSel=[];
  toggleLista(atual.servicosSel,id);
}
function toggleServicoPadrao(id){
  if(!padroes.servicosSel) padroes.servicosSel=[];
  toggleLista(padroes.servicosSel,id);
}

function subtotal(o){ return o.itens.reduce((s,i)=>s+i.subtotal,0); }
function descontoValor(o){
  const d=Number(o.desconto)||0, sub=subtotal(o);
  if(o.descontoTipo==='%') return Math.round(sub*Math.min(d,100)/100*100)/100;
  return Math.min(d,sub);
}
function totalFinal(o){ return Math.max(0, subtotal(o) - descontoValor(o)); }
function itensZerados(o){ return o.itens.filter(it=>!it.preco || it.preco<=0); }

  const d=descontoValor(atual);

  if(dv) dv.innerHTML='&minus; '+fmt(d);

}
function addItem(){
  const sel=document.getElementById('a-item'), q=document.getElementById('a-qtd'), err=document.getElementById('a-err');
  const qtd=parseFloat(q.value);
  if(isNaN(qtd)||qtd<=0){ err.textContent='Informe uma quantidade válida.'; err.style.display='block'; return; }
  const c=catalogo.find(x=>x.id===sel.value);
  if(!c){ err.textContent='Escolha um item.'; err.style.display='block'; return; }
  atual.itens.push({nome:c.nome,unidade:c.unidade,preco:c.preco,quantidade:qtd,subtotal:Math.round(c.preco*qtd*100)/100});
  renderOrcamento();
}
function rmItem(ix){ atual.itens.splice(ix,1); renderOrcamento(); }
function limparOrcamento(){ atual=novoOrcamento(); aplicarPadroes(atual); renderOrcamento(); toast('Orçamento limpo'); }

async function salvarOrcamento(){
  if(!atual.cliente.trim()){ toast('Informe o nome do cliente'); return; }
  if(!atual.itens.length){ toast('Adicione ao menos um item'); return; }
  garantirNumero(atual);
  const copia=JSON.parse(JSON.stringify(atual));
  copia.total=totalFinal(atual);
  if(atual.id){
    const i=orcamentos.findIndex(x=>x.id===atual.id);
    if(i>-1) orcamentos[i]=copia; else { copia.id=uid(); orcamentos.unshift(copia); }
  }else{
    copia.id=uid(); orcamentos.unshift(copia);
  }
  await persist('orcamentos',orcamentos);
  const temZerado = itensZerados(atual).length>0;
  atual=novoOrcamento(); aplicarPadroes(atual);
  renderOrcamento(); renderSalvos();
  toast(temZerado ? 'Salvo — mas há item com preço R$ 0,00' : 'Orçamento salvo');
  switchTab('salvos');
}

async function importarDados(){
  const inp=document.getElementById('imp-file');
  const err=document.getElementById('imp-err');
  if(!inp.files || !inp.files[0]){ err.textContent='Escolha um arquivo primeiro.'; err.style.display='block'; return; }
  try{
    const txt = await inp.files[0].text();
    const dados = JSON.parse(txt);
    if(!dados || !Array.isArray(dados.catalogo) || !Array.isArray(dados.orcamentos)){
      err.textContent='Arquivo inválido — não parece um backup deste app.'; err.style.display='block'; return;
    }
    catalogo = dados.catalogo;
    orcamentos = dados.orcamentos;
    padroes = Object.assign({}, DEFAULT_PADROES, dados.padroes||{});
    contador = dados.contador || 0;
    let maxExistente=0;
    for(let i=0;i<orcamentos.length;i++) if(orcamentos[i].numero>maxExistente) maxExistente=orcamentos[i].numero;
    if(maxExistente>contador) contador=maxExistente;
    await persist('catalogo',catalogo);
    await persist('orcamentos',orcamentos);
    await persist('padroes',padroes);
    await persist('contador',contador);
    closeModal(); render(); toast('Backup importado com sucesso');
  }catch(e){ err.textContent='Não consegui ler esse arquivo.'; err.style.display='block'; }
}

/* ---------------- gerador de PDF (puro, sem bibliotecas) ---------------- */
const LOGO_W = 520, LOGO_H = 459;
const PW = 595.28, PH = 841.89, MG = 46;
const CW = PW - 2*MG;

const PRETO  = '0.09 0.09 0.10';
const GRAF   = '0.38 0.39 0.41';
const CLARO  = '0.62 0.63 0.65';
const ACC    = '0.87 0.66 0.26';
const FUNDO  = '0.957 0.957 0.955';
const ZEBRA  = '0.975 0.975 0.973';

const WINANSI = {0x2022:149,0x2013:150,0x2014:151,0x2018:145,0x2019:146,0x201C:147,0x201D:148,
                 0x20AC:128,0x00A0:32,0x2212:45,0x2026:133,0x00AD:45};
function encTxt(s){
  let out='';
  const str=String(s==null?'':s);
  for(let i=0;i<str.length;i++){
    let c=str.charCodeAt(i);
    if(WINANSI[c]!==undefined) c=WINANSI[c];
    else if(c>255) c=63;
    const ch=String.fromCharCode(c);
    if(ch==='('||ch===')'||ch==='\\') out+='\\'+ch; else out+=ch;
  }
  return out;
}
const rr = n => Math.round(n*100)/100;

const _meas = (function(){ const c=document.createElement('canvas'); return c.getContext('2d'); })();
function txtW(t,size,bold){
  _meas.font=(bold?'bold ':'')+size+'px Helvetica, Arial, sans-serif';
  return _meas.measureText(String(t==null?'':t)).width;
}
function wrapTxt(t,size,bold,maxW){
  const words=String(t==null?'':t).split(/\s+/).filter(Boolean);
  const linhas=[]; let cur='';
  for(let i=0;i<words.length;i++){
    const test = cur ? cur+' '+words[i] : words[i];
    if(txtW(test,size,bold)<=maxW || !cur) cur=test;
    else { linhas.push(cur); cur=words[i]; }
  }
  if(cur) linhas.push(cur);
  return linhas.length?linhas:[''];
}
function corta(t,size,bold,maxW){
  if(txtW(t,size,bold)<=maxW) return t;
  let s=String(t);
  while(s.length>1 && txtW(s+'\u2026',size,bold)>maxW) s=s.slice(0,-1);
  return s+'\u2026';
}

function Folha(){ this.paginas=[]; this.ops=null; this.y=0; this.novaPagina(); }
Folha.prototype.novaPagina=function(){
  this.ops=[]; this.paginas.push(this.ops);
  this.y = this.paginas.length>1 ? PH-MG-30 : PH-MG;
};
Folha.prototype.espaco=function(h){ if(this.y-h < MG+34) this.novaPagina(); };
Folha.prototype.texto=function(t,x,yy,size,bold,cor){
  this.ops.push('BT /'+(bold?'F2':'F1')+' '+size+' Tf '+(cor||PRETO)+' rg 1 0 0 1 '+rr(x)+' '+rr(yy)+' Tm ('+encTxt(t)+') Tj ET');
};
Folha.prototype.textoDir=function(t,xDir,yy,size,bold,cor){
  this.texto(t, xDir-txtW(t,size,bold), yy, size, bold, cor);
};
Folha.prototype.linha=function(x1,y1,x2,y2,esp,cinza){
  this.ops.push(rr(esp)+' w '+(cinza||'0.5')+' G '+rr(x1)+' '+rr(y1)+' m '+rr(x2)+' '+rr(y2)+' l S');
};
Folha.prototype.caixa=function(x,y,w,h,cor){
  this.ops.push((cor||FUNDO)+' rg '+rr(x)+' '+rr(y)+' '+rr(w)+' '+rr(h)+' re f');
};
Folha.prototype.imagem=function(x,yTopo,larg){
  const alt = larg*LOGO_H/LOGO_W;
  this.ops.push('q '+rr(larg)+' 0 0 '+rr(alt)+' '+rr(x)+' '+rr(yTopo-alt)+' cm /Im0 Do Q');
  return alt;
};
Folha.prototype.paragrafo=function(t,size,bold,recuo,cor,lead){
  const L = lead || size*1.45;
  const linhas = wrapTxt(t,size,bold,CW-(recuo||0));
  for(let i=0;i<linhas.length;i++){
    this.espaco(L);
    this.texto(linhas[i], MG+(recuo||0), this.y-size, size, bold, cor);
    this.y -= L;
  }
};
Folha.prototype.secao=function(t){
  this.espaco(52);
  this.y -= 20;
  this.caixa(MG, this.y-10, 3.2, 11, ACC);
  this.texto(String(t).toUpperCase(), MG+10.5, this.y-9, 9.5, true, PRETO);
  this.y -= 15;
  this.linha(MG,this.y,PW-MG,this.y,0.5,'0.84');
  this.y -= 13;
};
Folha.prototype.marcador=function(t,size){
  const s = size||9.5, L = s*1.45;
  const linhas = wrapTxt(t,s,false,CW-16);
  for(let i=0;i<linhas.length;i++){
    this.espaco(L);
    if(i===0) this.caixa(MG+2, this.y-s+2.2, 3, 3, GRAF);
    this.texto(linhas[i], MG+14, this.y-s, s, false, '0.16 0.16 0.17');
    this.y -= L;
  }
};
Folha.prototype.campo=function(rot,val,x,yTopo,larg){
  this.texto(String(rot).toUpperCase(), x, yTopo-7, 6.8, true, CLARO);
  this.texto(corta(val,10.5,false,larg), x, yTopo-21, 10.5, false, PRETO);
};

/* ---- montagem do arquivo PDF ---- */
function montarPDF(folha, jpegBin){
  const nPag = folha.paginas.length;
  const partes = []; let pos = 0; const off = {};
  function w(s){ partes.push(s); pos += s.length; }
  function obj(n, corpo){ off[n]=pos; w(n+' 0 obj\n'+corpo+'\nendobj\n'); }

  w('%PDF-1.4\n%\u00E2\u00E3\u00CF\u00D3\n');
  const idPag=[], idCont=[];
  for(let i=0;i<nPag;i++){ idPag.push(6+i*2); idCont.push(7+i*2); }

  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Count '+nPag+' /Kids ['+idPag.map(n=>n+' 0 R').join(' ')+'] >>');
  obj(3, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  obj(4, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');

  off[5]=pos;
  w('5 0 obj\n<< /Type /XObject /Subtype /Image /Width '+LOGO_W+' /Height '+LOGO_H+
    ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpegBin.length+' >>\nstream\n');
  w(jpegBin);
  w('\nendstream\nendobj\n');

  for(let i=0;i<nPag;i++){
    obj(idPag[i],
      '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+']'+
      ' /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << /Im0 5 0 R >> >>'+
      ' /Contents '+idCont[i]+' 0 R >>');
    const fluxo = folha.paginas[i].join('\n');
    off[idCont[i]]=pos;
    w(idCont[i]+' 0 obj\n<< /Length '+fluxo.length+' >>\nstream\n'+fluxo+'\nendstream\nendobj\n');
  }

  const total = 6 + nPag*2;
  const inicioXref = pos;
  let xref = 'xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let n=1;n<total;n++) xref += String(off[n]||0).padStart(10,'0')+' 00000 n \n';
  w(xref);
  w('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+inicioXref+'\n%%EOF\n');

  const str = partes.join('');
  const bytes = new Uint8Array(str.length);
  for(let i=0;i<str.length;i++) bytes[i] = str.charCodeAt(i) & 0xFF;
  return bytes;
}

/* ---- desenho ---- */
function desenharOrcamento(o){
  const f = new Folha();
  const sub = subtotal(o), desc = descontoValor(o), fim = Math.max(0, sub-desc);
  const num = numeroOrc(o);

  /* cabeçalho */
  const ALT = 104;
  f.caixa(0, PH-ALT, PW, ALT, PRETO);
  f.caixa(0, PH-5, PW, 5, ACC);
  f.imagem(MG, PH-24, 60);
  f.texto('BLACK CALHAS', MG+72, PH-52, 19, true, '1 1 1');
  f.texto('Qualidade e preço justo', MG+72, PH-67, 9, false, '0.68 0.68 0.70');
  f.textoDir('ORÇAMENTO', PW-MG, PH-48, 12.5, true, '1 1 1');
  f.textoDir('Nº '+num+'   ·   '+fmtData(o.data), PW-MG, PH-64, 8.5, false, ACC);
  f.y = PH-ALT-26;

  /* dados do cliente */
  const linhas = [];
  linhas.push([['Cliente', o.cliente||'—', 0.60],['Data de emissão', fmtData(o.data), 0.40]]);
  if(o.telefone) linhas.push([['Telefone', o.telefone, 0.60],['Orçamento', 'Nº '+num, 0.40]]);
  if(o.endereco) linhas.push([['Endereço da obra', o.endereco, 1]]);

  const altBloco = 15 + linhas.length*30;
  f.espaco(altBloco+10);
  f.caixa(MG, f.y-altBloco, CW, altBloco, FUNDO);
  f.caixa(MG, f.y-altBloco, 3.2, altBloco, ACC);
  let yy = f.y - 9;
  for(let i=0;i<linhas.length;i++){
    let x = MG+16;
    for(let k=0;k<linhas[i].length;k++){
      const c = linhas[i][k];
      const larg = (CW-32)*c[2] - 12;
      f.campo(c[0], c[1], x, yy, larg);
      x = MG + 16 + (CW-32)*c[2];
    }
    yy -= 30;
  }
  f.y -= altBloco + 4;

  /* serviços */
  const sel = SERVICOS.filter(s=>(o.servicosSel||[]).indexOf(s.id)>-1);
  const extra = (o.servicos||'').split('\n').map(x=>x.trim()).filter(Boolean);
  if(sel.length || extra.length){
    f.secao('Descrição dos serviços');
    for(let i=0;i<sel.length;i++){
      f.espaco(34);
      if(i>0){ f.linha(MG,f.y+5,PW-MG,f.y+5,0.4,'0.90'); f.y -= 6; }
      f.caixa(MG, f.y-9.5, 3, 10, PRETO);
      f.texto(sel[i].titulo, MG+10, f.y-9, 10.5, true, PRETO);
      f.y -= 16;
      f.paragrafo(sel[i].texto, 9.3, false, 10, '0.24 0.24 0.26');
      f.y -= 8;
    }
    if(extra.length){
      if(sel.length){
        f.espaco(28);
        f.linha(MG,f.y+5,PW-MG,f.y+5,0.4,'0.90'); f.y -= 8;
        f.texto('Escopo desta obra', MG, f.y-10, 10.5, true, PRETO);
        f.y -= 17;
      }
      for(let i=0;i<extra.length;i++) f.marcador(extra[i]);
    }
  }

  /* itens */
  if(o.itens.length){
    f.secao('Itens e valores');
    const xQtd = MG + CW*0.605, xUni = MG + CW*0.795, xTot = PW - MG - 10;

    f.espaco(30);
    f.caixa(MG, f.y-17, CW, 17, PRETO);
    f.texto('DESCRIÇÃO', MG+10, f.y-11.5, 7.2, true, '1 1 1');
    f.textoDir('QTD.', xQtd, f.y-11.5, 7.2, true, '1 1 1');
    f.textoDir('VALOR UNIT.', xUni, f.y-11.5, 7.2, true, '1 1 1');
    f.textoDir('TOTAL', xTot, f.y-11.5, 7.2, true, '1 1 1');
    f.y -= 17;

    for(let i=0;i<o.itens.length;i++){
      const it = o.itens[i];
      const ls = wrapTxt(it.nome, 10, false, CW*0.54);
      const alt = 10 + ls.length*13;
      f.espaco(alt);
      if(i%2===1) f.caixa(MG, f.y-alt, CW, alt, ZEBRA);
      const base = f.y - 15;
      for(let k=0;k<ls.length;k++) f.texto(ls[k], MG+10, base-k*13, 10, false, PRETO);
      f.textoDir(it.quantidade+' '+it.unidade, xQtd, base, 10, false, GRAF);
      f.textoDir(fmt(it.preco), xUni, base, 10, false, GRAF);
      f.textoDir(fmt(it.subtotal), xTot, base, 10, true, PRETO);
      f.y -= alt;
      f.linha(MG,f.y,PW-MG,f.y,0.4,'0.88');
    }

    /* totais */
    f.espaco(96);
    f.y -= 14;
    const xB = MG + CW*0.44, wB = PW-MG-xB;
    const nLin = desc>0 ? 2 : 1;
    const altS = 12 + nLin*19;
    f.caixa(xB, f.y-altS, wB, altS, FUNDO);
    let ys = f.y - 12;
    f.texto('Valor original', xB+12, ys-8, 9.5, false, GRAF);
    f.textoDir(fmt(sub), PW-MG-12, ys-8, 10, false, PRETO);
    ys -= 19;
    if(desc>0){
      const rot = o.descontoTipo==='%' ? 'Desconto especial ('+(Number(o.desconto)||0)+'%)' : 'Desconto especial';
      f.texto(rot, xB+12, ys-8, 9.5, false, GRAF);
      f.textoDir('- '+fmt(desc), PW-MG-12, ys-8, 10, false, PRETO);
    }
    f.y -= altS;
    f.caixa(xB, f.y-34, wB, 34, PRETO);
    f.caixa(xB, f.y-34, 3.2, 34, ACC);
    f.texto('VALOR FINAL', xB+14, f.y-21, 9.5, true, '0.72 0.72 0.74');
    f.textoDir(fmt(fim), PW-MG-12, f.y-22, 15, true, '1 1 1');
    f.y -= 34+10;
    f.paragrafo('O valor final contempla o material e a mão de obra necessários para a execução dos serviços descritos nesta proposta.', 8.3, false, 0, CLARO);
  }

  /* blocos de texto */
  const blocos = [
    ['Condições de pagamento', o.pagamento],
    ['Garantia', o.garantia],
    ['Prazo de execução', o.prazo],
    ['Validade da proposta', o.validade],
    ['Observações', o.obs]
  ];
  for(let i=0;i<blocos.length;i++){
    const ls = (blocos[i][1]||'').split('\n').map(x=>x.trim()).filter(Boolean);
    if(!ls.length) continue;
    f.secao(blocos[i][0]);
    for(let k=0;k<ls.length;k++){ f.marcador(ls[k], 9.3); f.y -= 2; }
  }

  /* assinaturas */
  f.espaco(88);
  f.y -= 42;
  const wS = (CW-46)/2;
  f.linha(MG, f.y, MG+wS, f.y, 0.7, '0.35');
  f.linha(MG+wS+46, f.y, PW-MG, f.y, 0.7, '0.35');
  f.texto('Cliente', MG, f.y-12, 8, true, GRAF);
  f.texto(o.cliente||'', MG+txtW('Cliente',8,true)+8, f.y-12, 8, false, CLARO);
  f.texto('Black Calhas', MG+wS+46, f.y-12, 8, true, GRAF);
  f.texto('Responsável pela execução', MG+wS+46+txtW('Black Calhas',8,true)+8, f.y-12, 8, false, CLARO);
  f.y -= 26;

  /* rodapé e topo das páginas seguintes */
  const tot = f.paginas.length;
  for(let i=0;i<tot;i++){
    const ops = f.paginas[i];
    if(i>0){
      ops.push(PRETO+' rg '+MG+' '+rr(PH-MG-3)+' '+rr(CW)+' 2.5 re f');
      ops.push('BT /F2 8.5 Tf '+PRETO+' rg 1 0 0 1 '+MG+' '+rr(PH-MG-17)+' Tm (BLACK CALHAS) Tj ET');
      const c='Orçamento Nº '+num+' · continuação';
      ops.push('BT /F1 8 Tf '+CLARO+' rg 1 0 0 1 '+rr(PW-MG-txtW(c,8,false))+' '+rr(PH-MG-17)+' Tm ('+encTxt(c)+') Tj ET');
    }
    const yr = MG-10;
    ops.push('0.5 w 0.85 G '+MG+' '+rr(yr+15)+' m '+rr(PW-MG)+' '+rr(yr+15)+' l S');
    const esq = 'Black Calhas \u2013 Qualidade e preço justo'+(padroes.contato?'   ·   '+padroes.contato:'');
    ops.push('BT /F1 7.8 Tf '+CLARO+' rg 1 0 0 1 '+MG+' '+rr(yr+2)+' Tm ('+encTxt(esq)+') Tj ET');
    const pg = (i+1)+' / '+tot;
    const wpg = txtW(pg,7.5,true)+14;
    ops.push(PRETO+' rg '+rr(PW-MG-wpg)+' '+rr(yr-3)+' '+rr(wpg)+' 14 re f');
    ops.push('BT /F2 7.5 Tf 1 1 1 rg 1 0 0 1 '+rr(PW-MG-wpg+7)+' '+rr(yr+1.5)+' Tm ('+encTxt(pg)+') Tj ET');
  }
  return f;
}

function nomeArquivo(o){
  const c=(o.cliente||'cliente').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase();
  return 'orcamento-'+numeroOrc(o)+'-'+(c||'cliente')+'.pdf';
}

function gerarPDF(o){
  if(!o.itens.length && !(o.servicosSel||[]).length){
    toast('Adicione itens ou serviços antes'); return;
  }
  const zerados = itensZerados(o);
  if(zerados.length){
    _pdfPendente = o;
    const verbo = zerados.length>1 ? 'estão' : 'está';
    document.getElementById('modal-root').innerHTML =
      '<div class="modal-bg"><div class="modal"><p class="modal-title">Confira antes de gerar</p>'+
      '<div class="warn">'+zerados.length+' item(ns) '+verbo+' com preço R$ 0,00: '+
      zerados.map(z=>esc(z.nome)).join(', ')+'. Revise o catálogo antes de mandar isso pro cliente.</div>'+
      '<div class="actions-row"><button class="btn" onclick="closeModal()">Revisar preços</button>'+
      '<button class="btn btn-primary" style="margin-top:0;" onclick="closeModal(); gerarPDFForcado(_pdfPendente)">Gerar mesmo assim</button></div>'+
      '</div></div>';
    return;
  }
  gerarPDFForcado(o);
}

function gerarPDFForcado(o){
  try{
    const folha = desenharOrcamento(o);
    const bytes = montarPDF(folha, atob(LOGO.split(',')[1]));
    const blob = new Blob([bytes], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const nome = nomeArquivo(o);

    const a=document.createElement('a');
    a.href=url; a.download=nome;
    document.body.appendChild(a); a.click(); a.remove();

    document.getElementById('modal-root').innerHTML =
      '<div class="modal-bg"><div class="modal"><p class="modal-title">PDF gerado</p>'+
      '<p class="hint" style="margin:0 0 14px;">Se o download não começou sozinho, use um dos botões abaixo.</p>'+
      '<a class="btn btn-primary" style="display:block;text-align:center;text-decoration:none;margin-top:0;" href="'+url+'" download="'+nome+'">Baixar arquivo</a>'+
      '<a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:9px;" href="'+url+'" target="_blank" rel="noopener">Abrir em nova aba</a>'+
      '<button class="btn" style="width:100%;margin-top:9px;" onclick="closeModal()">Fechar</button>'+
      '</div></div>';
  }catch(e){
    console.error(e);
    toast('Erro ao gerar: '+(e && e.message ? e.message : 'desconhecido'));
  }
}

function copiarTexto(o){
  const fim=totalFinal(o);
  let t='*BLACK CALHAS* — Qualidade e preço justo\n\n*ORÇAMENTO*\n';
  if(o.cliente) t+='Cliente: '+o.cliente+'\n';
  if(o.endereco) t+='Obra: '+o.endereco+'\n';
  t+='Data: '+fmtData(o.data)+'\n';
  const sel = SERVICOS.filter(s=>(o.servicosSel||[]).indexOf(s.id)>-1);
  if(sel.length){ t+='\n*Serviços*\n'; sel.forEach(s=>{ t+='• '+s.titulo+'\n'; }); }
  (o.servicos||'').split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>{ t+='• '+x+'\n'; });
  t+='\n';
  o.itens.forEach(it=>{ t+='• '+it.nome+' — '+it.quantidade+' '+it.unidade+' x '+fmt(it.preco)+' = '+fmt(it.subtotal)+'\n'; });
  const d=descontoValor(o);
  if(d>0){
    const rot = o.descontoTipo==='%' ? 'Desconto ('+(Number(o.desconto)||0)+'%)' : 'Desconto';
    t+='\nSubtotal: '+fmt(subtotal(o))+'\n'+rot+': -'+fmt(d);
  }
  t+='\n\n*VALOR FINAL: '+fmt(fim)+'*\n';
  if(o.pagamento) t+='\n*Pagamento*\n'+o.pagamento+'\n';
  if(o.garantia) t+='\n*Garantia*\n'+o.garantia+'\n';
  if(o.prazo) t+='\n*Prazo*\n'+o.prazo+'\n';
  if(o.validade) t+='\n'+o.validade+'\n';
  navigator.clipboard.writeText(t).then(()=>toast('Copiado — cole no WhatsApp'))
    .catch(()=>toast('Não consegui copiar'));
}
